<body>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Prevent pinch and double-tap zoom
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    });
  </script>
  <script>
    window.__BATTLECHURCH_WORLD_SCALE = 0.75;
  </script>
  <div id="appRoot">
    <div id="gameWrapper">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    <div id="touchControls" aria-hidden="true">
      <div class="touch-row">
        <div class="joystick-area left">
          <div class="joystick-base" id="moveStick">
            <!-- Movement stick: a circular 8-way pad (the game moves in 8
                 directions); the active direction lights up. -->
            <svg class="joystick-ring" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="stick-bg" cx="100" cy="100" r="96" />
              <circle class="stick-inner" cx="100" cy="100" r="60" />
              <polygon class="stick-arrow stick-arrow-big" data-dir="0" points="192.0,100.0 174.0,113.0 174.0,87.0" />
              <polygon class="stick-arrow" data-dir="1" points="162.2,162.2 150.2,160.1 160.1,150.2" />
              <polygon class="stick-arrow stick-arrow-big" data-dir="2" points="100.0,192.0 87.0,174.0 113.0,174.0" />
              <polygon class="stick-arrow" data-dir="3" points="37.8,162.2 39.9,150.2 49.8,160.1" />
              <polygon class="stick-arrow stick-arrow-big" data-dir="4" points="8.0,100.0 26.0,87.0 26.0,113.0" />
              <polygon class="stick-arrow" data-dir="5" points="37.8,37.8 49.8,39.9 39.9,49.8" />
              <polygon class="stick-arrow stick-arrow-big" data-dir="6" points="100.0,8.0 113.0,26.0 87.0,26.0" />
              <polygon class="stick-arrow" data-dir="7" points="162.2,37.8 160.1,49.8 150.2,39.9" />
            </svg>
            <div class="joystick-handle"></div>
          </div>
        </div>
        <div class="center-controls"></div>
        <div class="button-area right">
          <svg id="arcControl" viewBox="0 0 260 260" role="group" aria-label="Action Buttons">
            <!-- Looks like three buttons, but works like six: a thumb on the line
                 between two buttons presses both (hidden A+B / A+C / B+C zones),
                 and the middle where all three meet presses all three. The hidden
                 zones are defined in input.js (ABC_PAD_*). -->
            <g class="abc-btn" data-seg="C">
              <path class="arc-segment arc-c" data-seg="C" d="M 130 130 L 24.34 69.0 A 122 122 0 0 1 235.66 69.0 Z" />
              <text class="arc-label" data-seg="C" x="130.0" y="51.24">C</text>
              <text class="abc-sub" data-seg="C" x="130.0" y="83.24">PRAY</text>
            </g>
            <g class="abc-btn" data-seg="A">
              <path class="arc-segment arc-a" data-seg="A" d="M 130 130 L 235.66 69.0 A 122 122 0 0 1 130.0 252.0 Z" />
              <text class="arc-label" data-seg="A" x="191.28" y="157.38">A</text>
              <text class="abc-sub" data-seg="A" x="191.28" y="189.38">SWORD</text>
            </g>
            <g class="abc-btn" data-seg="B">
              <path class="arc-segment arc-b" data-seg="B" d="M 130 130 L 130.0 252.0 A 122 122 0 0 1 24.34 69.0 Z" />
              <text class="arc-label" data-seg="B" x="68.72" y="157.38">B</text>
              <text class="abc-sub" data-seg="B" x="68.72" y="189.38">DASH</text>
            </g>
            <!-- Dashes mark the edges of the hidden "press both" zones (20 degrees
                 either side of each border, 25 for the C/A border; keep in sync
                 with ABC_PAD_DIAGONALS). -->
            <line class="abc-overlap-dash" x1="150.99" y1="100.02" x2="197.18" y2="34.06" />
            <line class="abc-overlap-dash" x1="166.46" y1="126.81" x2="246.67" y2="119.79" />
            <line class="abc-overlap-dash" x1="142.52" y1="164.39" x2="170.06" y2="240.06" />
            <line class="abc-overlap-dash" x1="117.48" y1="164.39" x2="89.94" y2="240.06" />
            <line class="abc-overlap-dash" x1="93.96" y1="123.64" x2="14.66" y2="109.66" />
            <line class="abc-overlap-dash" x1="106.47" y1="101.96" x2="54.72" y2="40.28" />
          </svg>
        </div>
      </div>
      <button type="button" id="touchPauseButton" class="touch-pause" aria-label="Pause">
        <span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>
    <div id="rotatePrompt" aria-live="polite">Rotate your phone</div>
  </div>
    <!-- Removed right joystick and arrow button controls for future A/B button implementation -->
