<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="version" content="2025-10-17 22:45 (America/New_York)">
  <title>Battle Church</title>
  <link rel="icon" href="assets/sprites/items/icons/I10_Flower.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Prevent pinch and double-tap zoom
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    });
  </script>
  <script>
    window.__BATTLECHURCH_WORLD_SCALE = 0.75;
  </script>
  <div id="appRoot">
    <div id="gameWrapper">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    <div id="touchControls" aria-hidden="true">
      <div class="touch-row">
        <div class="joystick-area left">
          <div class="joystick-base" id="moveStick">
            <div class="joystick-handle"></div>
          </div>
        </div>
        <div class="center-controls"></div>
        <div class="button-area right">
          <svg id="arcControl" viewBox="0 0 260 250" role="group" aria-label="Action Buttons">
            <!-- A, B and C in a triangle so every pair touches: slide from one
                 button to another for combos (e.g. C then A = Reap). -->
            <g class="abc-btn" data-seg="C">
              <circle class="arc-segment arc-c" data-seg="C" cx="118" cy="80" r="54" />
              <text class="arc-label" data-seg="C" x="118" y="74">C</text>
              <text class="abc-sub" data-seg="C" x="118" y="104">PRAY</text>
            </g>
            <g class="abc-btn" data-seg="B">
              <circle class="arc-segment arc-b" data-seg="B" cx="70" cy="180" r="54" />
              <text class="arc-label" data-seg="B" x="70" y="174">B</text>
              <text class="abc-sub" data-seg="B" x="70" y="204">DASH</text>
            </g>
            <g class="abc-btn" data-seg="A">
              <circle class="arc-segment arc-a" data-seg="A" cx="184" cy="174" r="64" />
              <text class="arc-label" data-seg="A" x="184" y="168">A</text>
              <text class="abc-sub" data-seg="A" x="184" y="200">SWORD</text>
            </g>
          </svg>
        </div>
      </div>
      <button type="button" id="touchPauseButton" class="touch-pause" aria-label="Pause">
        <span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>
    <div id="rotatePrompt" aria-live="polite">Rotate your phone</div>
  </div>
    <!-- Removed right joystick and arrow button controls for future A/B button implementation -->
    <!-- Only left joystick and space button remain -->
    <script src="overrides.js"></script>
    <script type="module" src="firebase.js"></script>
