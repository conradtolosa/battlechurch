<!-- Battle Church -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="version" content="2025-10-17 22:45 (America/New_York)">
  <title>Battle Church</title>
  <link rel="icon" href="assets/sprites/items/icons/I10_Flower.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Prevent pinch and double-tap zoom
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    });
  </script>
  <script>
    window.__BATTLECHURCH_WORLD_SCALE = 0.75;
  </script>
  <div id="appRoot">
    <div id="gameWrapper">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    <div id="touchControls" aria-hidden="true">
      <div class="touch-row">
        <div class="joystick-area left">
          <div class="joystick-base" id="moveStick">
            <div class="joystick-handle"></div>
          </div>
        </div>
        <div class="center-controls"></div>
        <div class="button-area right">
          <svg id="arcControl" viewBox="0 0 260 260" role="group" aria-label="Action Buttons">
            <!-- Six slices like a D-pad with diagonals: A, B, C plus a smaller
                 "both" slice between each pair (A+B, A+C, B+C); the center dot
                 holds all three. Angles must match ABC_PAD_* in input.js. -->
            <g class="abc-btn" data-seg="C">
              <path class="arc-segment arc-c" data-seg="C" d="M 130 130 L 51.58 36.54 A 122 122 0 0 1 208.42 36.54 Z" />
              <text class="arc-label" data-seg="C" x="130.0" y="48.8">C</text>
              <text class="abc-sub" data-seg="C" x="130.0" y="80.8">PRAY</text>
            </g>
            <g class="abc-btn" data-seg="A">
              <path class="arc-segment arc-a" data-seg="A" d="M 130 130 L 250.15 108.81 A 122 122 0 0 1 171.73 244.64 Z" />
              <text class="arc-label" data-seg="A" x="193.39" y="158.6">A</text>
              <text class="abc-sub" data-seg="A" x="193.39" y="190.6">SWORD</text>
            </g>
            <g class="abc-btn" data-seg="B">
              <path class="arc-segment arc-b" data-seg="B" d="M 130 130 L 88.27 244.64 A 122 122 0 0 1 9.85 108.81 Z" />
              <text class="arc-label" data-seg="B" x="66.61" y="158.6">B</text>
              <text class="abc-sub" data-seg="B" x="66.61" y="190.6">DASH</text>
            </g>
            <path class="abc-diag abc-diag-ac" data-combo="AC" d="M 130 130 L 208.42 36.54 A 122 122 0 0 1 250.15 108.81 Z" />
            <text class="abc-diag-label" data-combo="AC" x="206.07" y="86.08">A+C</text>
            <path class="abc-diag abc-diag-ab" data-combo="AB" d="M 130 130 L 171.73 244.64 A 122 122 0 0 1 88.27 244.64 Z" />
            <text class="abc-diag-label" data-combo="AB" x="130.0" y="217.84">A+B</text>
            <path class="abc-diag abc-diag-bc" data-combo="BC" d="M 130 130 L 9.85 108.81 A 122 122 0 0 1 51.58 36.54 Z" />
            <text class="abc-diag-label" data-combo="BC" x="53.93" y="86.08">B+C</text>
            <circle class="arc-junction" data-seg="ABC" cx="130" cy="130" r="22" />
          </svg>
        </div>
      </div>
      <button type="button" id="touchPauseButton" class="touch-pause" aria-label="Pause">
        <span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>
    <div id="rotatePrompt" aria-live="polite">Rotate your phone</div>
  </div>
    <!-- Removed right joystick and arrow button controls for future A/B button implementation -->
    <!-- Only left joystick and space button remain -->

</body>
</html>
